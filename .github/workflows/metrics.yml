name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          
          # STRIPPED DOWN BASE: 
          # Removed 'header' (avatar/calendar) and 'community' (followers/following)
          # Keeps only Commits (Activity) and Total Repos (Repositories)
          base: activity, repositories
          config_timezone: Asia/Kolkata
          
          # LANGUAGES ONLY:
          # Keeps the bar graph and your top 5 languages
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 5
          plugin_languages_details: percentage
