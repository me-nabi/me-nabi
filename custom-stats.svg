<svg width="450" height="140" viewBox="0 0 450 140" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#161b22" />
            <stop offset="100%" stop-color="#0d1117" />
        </linearGradient>
        <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8a2be2" />
            <stop offset="100%" stop-color="#36BCF7" />
        </linearGradient>
    </defs>
    <!-- Background and Gradient Border -->
    <rect width="450" height="140" fill="url(#bg)" rx="10"/>
    <rect x="1" y="1" width="448" height="138" fill="none" rx="9" stroke="url(#border)" stroke-width="2"/>
    
    <g font-family="Segoe UI, Ubuntu, sans-serif">
        <text x="25" y="35" fill="#fff" font-size="18" font-weight="bold">GitHub Activity</text>
        
        <!-- Commits Block -->
        <g transform="translate(25, 60)">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#36BCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <line x1="12" y1="4" x2="12" y2="8"></line>
                <line x1="12" y1="16" x2="12" y2="20"></line>
                <line x1="4" y1="12" x2="8" y2="12"></line>
                <line x1="16" y1="12" x2="20" y2="12"></line>
            </svg>
            <text x="40" y="18" fill="#a9b1d6" font-size="14">Total Commits</text>
            <text x="40" y="45" fill="#fff" font-size="24" font-weight="bold">256</text>
        </g>

        <!-- Repositories Block -->
        <g transform="translate(230, 60)">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8a2be2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            <text x="40" y="18" fill="#a9b1d6" font-size="14">Repositories</text>
            <text x="40" y="45" fill="#fff" font-size="24" font-weight="bold">44</text>
        </g>
    </g>
</svg>